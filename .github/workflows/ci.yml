name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compilar y pasar los tests
        run: ./mvnw -B verify

  # Revisión de las dependencias que añade o cambia la PR, contra GitHub Advisory Database.
  # Rápida y sin claves. Solo avisa: no bloquea la PR.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Revisar dependencias de la PR
        uses: actions/dependency-review-action@v5
        continue-on-error: true
        with:
          fail-on-severity: high
          warn-only: true

  # Auditoría completa de dependencias con OWASP dependency-check (informativa).
  # La base de datos de NVD se guarda en caché entre ejecuciones; el secreto NVD_API_KEY es opcional.
  dependency-check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Restaurar la base de datos de dependency-check
        uses: actions/cache/restore@v6
        with:
          path: ~/.dependency-check/data
          key: dependency-check-data-${{ github.run_id }}
          restore-keys: dependency-check-data-
      - name: Auditar dependencias
        continue-on-error: true
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          args=()
          if [ -n "$NVD_API_KEY" ]; then
            args+=("-DnvdApiKeyEnvironmentVariable=NVD_API_KEY")
          else
            echo "::notice::Sin secreto NVD_API_KEY: la descarga de la base de datos de NVD será lenta."
          fi
          ./mvnw -B -P dependency-check -DskipTests "${args[@]}" verify
      - name: Guardar la base de datos de dependency-check
        if: always() && github.event_name == 'push'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ~/.dependency-check/data
          key: dependency-check-data-${{ github.run_id }}
      - name: Resumen de la auditoría
        if: always()
        continue-on-error: true
        run: |
          report=target/dependency-check-report.json
          exec 3>&1
          {
            echo "## Auditoría de dependencias (OWASP dependency-check)"
            echo
            if [ ! -f "$report" ]; then
              echo "No se ha generado el informe. Revisa el log del paso «Auditar dependencias»."
              echo "::warning::dependency-check no ha generado informe." >&3
              exit 0
            fi
            total=$(jq '[.dependencies[] | select(.vulnerabilities)] | length' "$report")
            if [ "$total" -eq 0 ]; then
              echo "Sin vulnerabilidades conocidas."
              exit 0
            fi
            echo "::warning::dependency-check ha encontrado $total dependencias con vulnerabilidades." >&3
            echo "$total dependencias con vulnerabilidades conocidas. Detalle en el artifact \`dependency-check-report\`."
            echo
            echo "| Severidad | Vulnerabilidades |"
            echo "|---|---|"
            jq -r '[.dependencies[] | .vulnerabilities // [] | .[] | (.severity // "UNKNOWN" | ascii_upcase)]
                   | group_by(.) | map("| \(.[0]) | \(length) |") | .[]' "$report"
            echo
            echo "| Dependencia | Vulnerabilidades |"
            echo "|---|---|"
            jq -r '.dependencies[] | select(.vulnerabilities)
                   | "| \(.fileName) | \([.vulnerabilities[].name] | join(", ")) |"' "$report"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Subir el informe
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: dependency-check-report
          path: |
            target/dependency-check-report.html
            target/dependency-check-report.json
          if-no-files-found: warn
